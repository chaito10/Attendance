<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- WASM SQLite -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<style>
  :root{
    --cover: #28402f;
    --cover-dark: #1b2c20;
    --brass: #9c7a3c;
    --paper: #f1ead9;
    --paper-2: #e9e0c9;
    --line: #c7bb99;
    --ink: #232a22;
    --ink-soft: #6b6650;
    --stamp: #a3392c;
    --stamp-dark: #7e2a20;
    --good: #3d6b4a;
    --font-display: 'Zilla Slab', Georgia, serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: #0f1712;
    background-image: radial-gradient(ellipse at top, #1c2b21 0%, #0f1712 70%);
    font-family: var(--font-body);
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 14px 60px;
  }
  .book{
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.4);
  }
  .spine{
    width: 34px; flex: none;
    background: linear-gradient(180deg, var(--cover), var(--cover-dark));
    display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
    padding: 24px 0;
  }
  .rivet{
    width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c9a75c, var(--brass) 60%, #6e5324 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.5) inset, 0 1px 1px rgba(255,255,255,0.15);
  }
  .pages{
    flex: 1;
    background: repeating-linear-gradient(var(--paper), var(--paper) 34px, var(--line) 35px), linear-gradient(180deg, var(--paper), var(--paper-2));
    padding: 26px 26px 20px;
    min-width: 0;
  }
  header.title{
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 4px; flex-wrap: wrap; gap: 6px;
  }
  header.title h1{
    font-family: var(--font-display); font-weight: 700; font-size: 26px;
    letter-spacing: 0.04em; margin: 0; text-transform: uppercase;
  }
  .head-right{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  header.title .today{ font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); }
  .peer-badge{ font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); display:flex; align-items:center; gap:5px; }
  .peer-dot{ width:7px; height:7px; border-radius:50%; background:#9a9179; }
  .peer-dot.live{ background: var(--good); box-shadow: 0 0 0 2px rgba(61,107,74,0.2); }
  nav.tabs{ display: flex; gap: 6px; margin: 16px 0 18px; }
  nav.tabs button{
    font-family: var(--font-display); font-size: 14.5px; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--paper-2); border: 1px solid var(--line); border-bottom: none; color: var(--ink-soft);
    padding: 8px 16px 7px; border-radius: 6px 6px 0 0; cursor: pointer;
  }
  nav.tabs button.active{
    background: var(--paper); color: var(--ink); font-weight: 700; border-color: var(--ink);
    box-shadow: 0 -2px 0 var(--stamp) inset;
  }
  .card{ background: rgba(255,255,255,0.28); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .status-row{ display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .status-dot{ width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .status-dot.open{ background: var(--good); box-shadow: 0 0 0 3px rgba(61,107,74,0.2); }
  .status-dot.closed{ background: var(--stamp); box-shadow: 0 0 0 3px rgba(163,57,44,0.18); }
  .muted{ color: var(--ink-soft); font-size: 12.5px; }
  .count-badge{ font-family: var(--font-mono); font-weight: 600; font-size: 13px; background: var(--ink); color: var(--paper); padding: 4px 10px; border-radius: 20px; }
  input[type=text], input[type=password], input[type=date], input[type=tel], textarea, select{
    font-family: var(--font-mono); background: rgba(255,255,255,0.55); border: 1px solid var(--line);
    border-radius: 5px; padding: 9px 10px; font-size: 14px; color: var(--ink); width: 100%;
  }
  input:focus, textarea:focus, select:focus, button:focus-visible{ outline: 2px solid var(--stamp); outline-offset: 1px; }
  .search{ margin-bottom: 12px; }
  .roster-list{ display: flex; flex-direction: column; }
  .roll-row{ display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px dashed var(--line); }
  .roll-row:last-child{ border-bottom: none; }
  .roll-no{ font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
  .stud-name{ font-family: var(--font-body); font-size: 15px; font-weight: 500; }
  .stud-name .sub{ display:block; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); font-weight: 400; margin-top:1px; }
  button.mark-btn{
    font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--ink); color: var(--paper); border: none; border-radius: 5px; padding: 9px 14px; cursor: pointer;
    transition: transform 0.08s ease;
  }
  button.mark-btn:disabled{ background: var(--line); color: var(--ink-soft); cursor: default; }
  button.mark-btn:active:not(:disabled){ transform: scale(0.96); }
  .stamp-wrap{ position: relative; display:flex; align-items:center; justify-content:flex-end; }
  .stamp{
    font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; color: var(--stamp);
    border: 2.5px solid var(--stamp); border-radius: 4px; padding: 3px 8px; transform: rotate(-9deg) scale(1);
    display: inline-block; text-transform: uppercase; opacity: 0.92; animation: stampIn 0.28s cubic-bezier(.2,1.4,.4,1);
  }
  .stamp.big{ font-size: 20px; padding: 8px 18px; border-width: 3px; }
  @keyframes stampIn{ 0%{ transform: rotate(-9deg) scale(2.4); opacity: 0; } 60%{ opacity: 1; } 100%{ transform: rotate(-9deg) scale(1); opacity: 0.92; } }
  @media (prefers-reduced-motion: reduce){ .stamp{ animation: none; } button.mark-btn{ transition: none; } }
  .btn{
    font-family: var(--font-display); font-weight: 600; font-size: 13.5px; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--cover); color: var(--paper); border: none; border-radius: 5px; padding: 9px 16px; cursor: pointer;
  }
  .btn.secondary{ background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.big{ font-size: 16px; padding: 13px 22px; width: 100%; }
  .btn:disabled{ opacity: 0.5; cursor: default; }
  .row{ display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size: 12.5px; color: var(--ink-soft); flex:1; min-width: 140px; }
  h2.section{ font-family: var(--font-display); font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .pin-gate{ text-align:center; padding: 30px 10px; }
  .pin-gate input{ max-width: 160px; margin: 12px auto; text-align:center; letter-spacing: 0.3em; font-size: 18px; }
  table.report{ width:100%; border-collapse: collapse; font-size: 13.5px; }
  table.report th, table.report td{ text-align:left; padding: 7px 6px; border-bottom: 1px dashed var(--line); }
  table.report th{ font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; color: var(--ink-soft); }
  .empty{ text-align:center; padding: 30px 10px; color: var(--ink-soft); font-size: 13.5px; }
  .toast{
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper);
    font-family: var(--font-mono); font-size: 13px; padding: 9px 16px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease; z-index: 50;
  }
  .toast.show{ opacity: 0.96; }
  .rem-btn{ background:none; border:none; color: var(--stamp-dark); cursor:pointer; font-size: 12px; font-family: var(--font-mono); }
  .id-card{ text-align:center; padding: 8px 10px 18px; }
  .id-card .name{ font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 6px 0 2px; }
  .id-card .roll{ font-family: var(--font-mono); color: var(--ink-soft); font-size: 13px; }
  .qr-box{ text-align:center; }
  .qr-box img{ border: 6px solid #fff; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); margin: 10px 0; }
  .link-copy{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .link-copy code{ font-family: var(--font-mono); font-size: 12px; background: rgba(0,0,0,0.06); padding: 5px 8px; border-radius: 4px; word-break: break-all; }
  .percent-badge{ font-family: var(--font-mono); font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 20px; }
  .percent-badge.ok{ background: rgba(61,107,74,0.15); color: var(--good); }
  .percent-badge.low{ background: rgba(163,57,44,0.14); color: var(--stamp-dark); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<body>
  <div class="book">
    <div class="spine">
      <div class="rivet"></div><div class="rivet"></div><div class="rivet"></div><div class="rivet"></div>
    </div>
    <div class="pages">
      <header class="title">
        <h1>Attendance Register</h1>
        <div class="head-right">
          <div class="today" id="todayLabel">—</div>
          <div class="peer-badge"><span class="peer-dot" id="peerDot"></span><span id="peerText">starting sync…</span></div>
        </div>
      </header>
      <nav class="tabs">
        <button id="tabCheckin" class="active">Check In</button>
        <button id="tabRegister">Register</button>
      </nav>
      <div id="view"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // Change this once per class/semester before you deploy — it's the WebRTC room
  // every device syncs through. Different code = different, unconnected roster.
  var ROOM_ID = "nfsu-cyber-attendance-2026";

  var todayStr = new Date().toISOString().slice(0,10);
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined,{ weekday:'short', year:'numeric', month:'short', day:'numeric' });

  var SQL = null;       // sql.js module
  var db = null;        // live database
  var peerCount = 0;
  var broadcastMutation = null;
  var forceResync = null;

  var state = {
    tab: 'checkin',
    profile: null,
    reportDate: todayStr,
    loading: true
  };

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function updatePeerBadge(){
    document.getElementById('peerDot').classList.toggle('live', peerCount > 0);
    document.getElementById('peerText').textContent = peerCount > 0
      ? (peerCount + ' device' + (peerCount === 1 ? '' : 's') + ' synced')
      : 'no devices linked yet';
  }

  // ---------- device-local identity (per-phone, plain browser storage — fine now this isn't a Claude artifact) ----------
  function loadProfile(){ try{ var v = localStorage.getItem('attendance_profile_v1'); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function saveProfile(p){ try{ localStorage.setItem('attendance_profile_v1', JSON.stringify(p)); }catch(e){} }
  function clearProfile(){ try{ localStorage.removeItem('attendance_profile_v1'); }catch(e){} }

  // ---------- local IndexedDB persistence of the sqlite file (per device) ----------
  var IDB_NAME = 'attendance-sqlite', IDB_STORE = 'kv';
  function idbOpen(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function idbGet(key){
    return idbOpen().then(function(idb){
      return new Promise(function(resolve, reject){
        var tx = idb.transaction(IDB_STORE, 'readonly');
        var r = tx.objectStore(IDB_STORE).get(key);
        r.onsuccess = function(){ resolve(r.result || null); };
        r.onerror = function(){ reject(r.error); };
      });
    }).catch(function(){ return null; });
  }
  function idbSet(key, val){
    return idbOpen().then(function(idb){
      return new Promise(function(resolve, reject){
        var tx = idb.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = function(){ resolve(true); };
        tx.onerror = function(){ reject(tx.error); };
      });
    }).catch(function(){ return false; });
  }
  var persistTimer = null;
  function persistLocal(){
    clearTimeout(persistTimer);
    persistTimer = setTimeout(function(){ idbSet('sqlite', db.export()); }, 200);
  }

  // ---------- sql.js helpers ----------
  function queryAll(sql, params){
    var stmt = db.prepare(sql);
    if (params) stmt.bind(params);
    var out = [];
    while (stmt.step()) out.push(stmt.getAsObject());
    stmt.free();
    return out;
  }
  function run(sql, params){ db.run(sql, params || []); }

  function runSchema(){
    run('CREATE TABLE IF NOT EXISTS students (id TEXT PRIMARY KEY, roll TEXT, name TEXT, phone TEXT)');
    run('CREATE TABLE IF NOT EXISTS sessions (date TEXT PRIMARY KEY, open INTEGER)');
    run('CREATE TABLE IF NOT EXISTS attendance (date TEXT, student_id TEXT, time TEXT, PRIMARY KEY(date, student_id))');
    run('CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT)');
  }

  // ---------- reads ----------
  function getRoster(){ return queryAll('SELECT * FROM students ORDER BY roll'); }
  function getSessionOpen(date){ var r = queryAll('SELECT open FROM sessions WHERE date=?', [date]); return r.length ? !!r[0].open : false; }
  function getAttendanceMap(date){
    var rows = queryAll('SELECT student_id, time FROM attendance WHERE date=?', [date]);
    var map = {}; rows.forEach(function(r){ map[r.student_id] = { time: r.time }; }); return map;
  }
  function getSessionDates(){ return queryAll('SELECT date FROM sessions ORDER BY date').map(function(r){ return r.date; }); }
  function getHistoryDates(id){ return queryAll('SELECT date FROM attendance WHERE student_id=? ORDER BY date', [id]).map(function(r){ return r.date; }); }
  function getSetting(key, def){ var r = queryAll('SELECT value FROM settings WHERE key=?', [key]); return r.length ? r[0].value : def; }

  // ---------- mutations (applied locally + broadcast to peers) ----------
  function applyMutationLocally(m){
    switch (m.type){
      case 'ADD_STUDENT':
        run('INSERT OR IGNORE INTO students (id,roll,name,phone) VALUES (?,?,?,?)', [m.id, m.roll, m.name, m.phone || '']);
        break;
      case 'REMOVE_STUDENT':
        run('DELETE FROM students WHERE id=?', [m.id]);
        break;
      case 'SET_SESSION':
        run('INSERT INTO sessions (date,open) VALUES (?,?) ON CONFLICT(date) DO UPDATE SET open=excluded.open', [m.date, m.open ? 1 : 0]);
        break;
      case 'MARK_ATTENDANCE':
        run('INSERT OR IGNORE INTO attendance (date,student_id,time) VALUES (?,?,?)', [m.date, m.student_id, m.time]);
        break;
      case 'SET_SETTING':
        run('INSERT INTO settings (key,value) VALUES (?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value', [m.key, m.value]);
        break;
    }
    persistLocal();
  }
  function doMutation(m){
    applyMutationLocally(m);
    if (broadcastMutation){ try{ broadcastMutation(m); }catch(e){ console.error('broadcast failed', e); } }
    render();
  }
  function mergeExternalDump(bytesLike){
    try{
      var bytes = bytesLike instanceof Uint8Array ? bytesLike : new Uint8Array(bytesLike);
      var tmp = new SQL.Database(bytes);
      function copy(sql, insertSql){
        var r = tmp.exec(sql);
        if (!r.length) return;
        r[0].values.forEach(function(row){ run(insertSql, row); });
      }
      copy('SELECT id,roll,name,phone FROM students', 'INSERT OR IGNORE INTO students (id,roll,name,phone) VALUES (?,?,?,?)');
      copy('SELECT date,student_id,time FROM attendance', 'INSERT OR IGNORE INTO attendance (date,student_id,time) VALUES (?,?,?)');
      copy('SELECT date,open FROM sessions', 'INSERT INTO sessions (date,open) VALUES (?,?) ON CONFLICT(date) DO UPDATE SET open=excluded.open');
      copy('SELECT key,value FROM settings', 'INSERT INTO settings (key,value) VALUES (?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value');
      tmp.close();
      persistLocal();
    }catch(e){ console.error('merge failed', e); }
  }

  // ---------- Static GitHub Pages peer directory + sync ----------
  // GitHub Pages itself is read-only. A small GitHub repository is used as
  // the rendezvous point: each registered device publishes a peer record
  // through the GitHub Contents API, while every device polls the published
  // peers.json file from GitHub Pages. This removes the dependency on WebRTC
  // trackers/signalling and makes the peer list persistent.
  //
  // Configure these constants once before deployment:
  var GITHUB_OWNER = "chaito10";       // e.g. "your-org"
  var GITHUB_REPO = "Attendance";        // e.g. "attendance-peers"
  var GITHUB_BRANCH = "main";
  var GITHUB_PAGES_BASE = "https://chaito10.github.io/Attendance";  // e.g. "https://your-org.github.io/attendance-peers"
  var SYNC_INTERVAL_MS = 15000;

  var deviceId = null;
  var syncTimer = null;
  var githubConfigured = false;

  function getDeviceId(){
    try{
      var k = 'attendance_device_id_v1';
      var v = localStorage.getItem(k);
      if (!v){
        v = 'peer_' + crypto.randomUUID();
        localStorage.setItem(k, v);
      }
      return v;
    }catch(e){
      return 'peer_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }
  }

  function getPeerConfig(){
    return {
      owner: GITHUB_OWNER.trim(),
      repo: GITHUB_REPO.trim(),
      branch: GITHUB_BRANCH.trim() || 'main',
      pages: GITHUB_PAGES_BASE.trim().replace(/\/+$/,'')
    };
  }

  function refreshPeerStatus(count, text){
    peerCount = Math.max(0, count || 0);
    updatePeerBadge();
    if (text) document.getElementById('peerText').textContent = text;
  }

  async function fetchJson(url, opts){
    var res = await fetch(url, Object.assign({
      cache: 'no-store',
      headers: { 'Accept': 'application/vnd.github+json' }
    }, opts || {}));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function publicPeersUrl(){
    var c = getPeerConfig();
    return c.pages ? c.pages + '/peers.json?v=' + Date.now() : '';
  }

  async function readPublishedPeers(){
    var url = publicPeersUrl();
    if (!url) return [];
    try{
      var data = await fetch(url, { cache:'no-store' });
      if (!data.ok) throw new Error('peers.json HTTP ' + data.status);
      var peers = await data.json();
      return Array.isArray(peers) ? peers : [];
    }catch(e){
      console.warn('peer directory unavailable', e);
      return [];
    }
  }

  // ---------- 100% client-side QR WebRTC signaling ----------
  // No GitHub API, Firebase, database, peer directory, or signaling server.
  // The teacher creates a WebRTC offer and displays it as a QR code.
  // A phone scans the offer, creates an answer and displays an answer QR.
  // The teacher scans the answer QR. After that, attendance data travels
  // directly over the WebRTC data channel.
  var qrPeers = {};
  var qrHostConnection = null;
  var qrHostChannel = null;
  var qrPendingOffer = null;
  var qrPendingAnswer = null;
  var qrRole = null;

  function bytesToBase64(bytes){
    var binary = '';
    for (var i=0;i<bytes.length;i+=0x8000){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
    }
    return btoa(binary);
  }

  function base64ToBytes(str){
    var binary = atob(str);
    var out = new Uint8Array(binary.length);
    for (var i=0;i<binary.length;i++) out[i] = binary.charCodeAt(i);
    return out;
  }

  function qrEncode(obj){
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
  }

  function qrDecode(str){
    return JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
  }

  function qrIceConfig(){
    // Public STUN only helps WebRTC find a direct route; no attendance
    // payload is sent through it.
    return {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };
  }

  function waitIceComplete(pc, timeout){
    return new Promise(function(resolve){
      if (pc.iceGatheringState === 'complete'){
        resolve();
        return;
      }
      var done = false;
      function finish(){
        if (done) return;
        done = true;
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
      function check(){
        if (pc.iceGatheringState === 'complete') finish();
      }
      pc.addEventListener('icegatheringstatechange', check);
      setTimeout(finish, timeout || 8000);
    });
  }

  function makeSignalPayload(type, pc){
    return {
      v: 1,
      app: 'attendance-qr-p2p',
      type: type,
      room: ROOM_ID,
      from: getDeviceId(),
      description: pc.localDescription ? {
        type: pc.localDescription.type,
        sdp: pc.localDescription.sdp
      } : null
    };
  }

  function getDeviceId(){
    try{
      var k = 'attendance_device_id_v2';
      var v = localStorage.getItem(k);
      if (!v){
        v = 'peer_' + crypto.randomUUID();
        localStorage.setItem(k, v);
      }
      return v;
    }catch(e){
      return 'peer_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }
  }

  function setQrStatus(text){
    var el = document.getElementById('qrSyncStatus');
    if (el) el.textContent = text;
  }

  function renderQrCode(text, targetId){
    var el = document.getElementById(targetId);

        text: text,
        width: 300,
        height: 300,
        correctLevel: QRCode.CorrectLevel.M
      });
      return;
    }

    // Fallback: show the payload in a selectable box if QR library fails.
    var pre = document.createElement('textarea');
    pre.readOnly = true;
    pre.value = text;
    pre.style.width = '100%';
    pre.style.minHeight = '180px';
    el.appendChild(pre);

  function setupChannel(channel, peerId){
    qrHostChannel = channel;
    qrPeers[peerId] = { channel: channel, connectedAt: Date.now() };

    channel.onopen = function(){
      peerCount = Object.keys(qrPeers).filter(function(id){
        return qrPeers[id].channel && qrPeers[id].channel.readyState === 'open';
      }).length;
      updatePeerBadge();
      setQrStatus(peerCount + ' peer' + (peerCount === 1 ? '' : 's') + ' connected');
      try{
        channel.send(JSON.stringify({
          type:'snapshot',
          room:ROOM_ID,
          dump:bytesToBase64(db.export())
        }));
      }catch(e){}
    };

    channel.onclose = function(){
      delete qrPeers[peerId];
      peerCount = Object.keys(qrPeers).length;
      updatePeerBadge();
      setQrStatus('peer disconnected');
    };

    channel.onerror = function(e){
      console.warn('WebRTC data channel error', e);
    };

    channel.onmessage = function(event){
      try{
        var msg = JSON.parse(event.data);
        if (!msg || msg.room !== ROOM_ID) return;

        if (msg.type === 'snapshot' && msg.dump){
          mergeExternalDump(base64ToBytes(msg.dump));
          render();
          return;
        }

        if (msg.type === 'mutation' && msg.mutation){
          applyMutationLocally(msg.mutation);
          render();
        }
      }catch(e){
        console.warn('invalid peer message', e);
      }
    };
  }

  async function createQrOffer(){
    qrRole = 'host';
    var pc = new RTCPeerConnection(qrIceConfig());
    qrHostConnection = pc;

    var peerId = 'pending_' + Date.now();
    var channel = pc.createDataChannel('attendance', { ordered:true });
    setupChannel(channel, peerId);

    pc.onconnectionstatechange = function(){
      if (pc.connectionState === 'connected'){
        closeQrModal();
        setQrStatus('peer connected');
      }else if (pc.connectionState === 'failed' ||
                pc.connectionState === 'disconnected' ||
                pc.connectionState === 'closed'){
        setQrStatus('peer connection closed');
      }
    };

    await pc.setLocalDescription(await pc.createOffer());
    await waitIceComplete(pc, 10000);

    var payload = makeSignalPayload('offer', pc);
    qrPendingOffer = payload;

    showQrModal(
      'Step 1 — Scan this QR',
      'On the student phone, open Attendance → Join session and scan this QR. The phone will then show an answer QR.',
      qrEncode(payload),
      'HOST OFFER'
    );

    return payload;
  }

  async function acceptQrOffer(encoded){
    var offer;
    try{
      offer = typeof encoded === 'string' ? qrDecode(encoded) : encoded;
    }catch(e){
      toast('Invalid QR payload');
      return;
    }

    if (!offer || offer.app !== 'attendance-qr-p2p' ||
        offer.type !== 'offer' || offer.room !== ROOM_ID){
      toast('This QR is not for this attendance session');
      return;
    }

    qrRole = 'student';
    var pc = new RTCPeerConnection(qrIceConfig());
    qrHostConnection = pc;

    pc.ondatachannel = function(event){
      setupChannel(event.channel, offer.from || 'host');
    };

    pc.onconnectionstatechange = function(){
      if (pc.connectionState === 'connected'){
        closeQrModal();
        setQrStatus('connected to host');
      }else if (pc.connectionState === 'failed' ||
                pc.connectionState === 'disconnected' ||
                pc.connectionState === 'closed'){
        setQrStatus('connection closed');
      }
    };

    try{
      await pc.setRemoteDescription(offer.description);
      var answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitIceComplete(pc, 10000);

      qrPendingAnswer = makeSignalPayload('answer', pc);
      showQrModal(
        'Step 2 — Show answer QR',
        'Show this QR to the teacher. The teacher should scan it from the Join/Sync controls.',
        qrEncode(qrPendingAnswer),
        'STUDENT ANSWER'
      );
    }catch(e){
      console.error(e);
      toast('Could not create WebRTC answer');
    }
  }

  async function acceptQrAnswer(encoded){
    var answer;
    try{
      answer = typeof encoded === 'string' ? qrDecode(encoded) : encoded;
    }catch(e){
      toast('Invalid answer QR');
      return;
    }

    if (!qrHostConnection ||
        !answer ||
        answer.app !== 'attendance-qr-p2p' ||
        answer.type !== 'answer' ||
        answer.room !== ROOM_ID){
      toast('Answer does not match the open session');
      return;
    }

    try{
      await qrHostConnection.setRemoteDescription(answer.description);
      closeQrModal();
      setQrStatus('connecting to peer…');
    }catch(e){
      console.error(e);
      toast('Could not accept answer');
    }
  }

  function broadcastMutation(m){
    Object.keys(qrPeers).forEach(function(id){
      var ch = qrPeers[id] && qrPeers[id].channel;
      if (!ch || ch.readyState !== 'open') return;
      try{
        ch.send(JSON.stringify({
          type:'mutation',
          room:ROOM_ID,
          mutation:m
        }));
      }catch(e){}
    });
  }

  function startQrJoin(){
    if (qrRole === 'host'){

  function handleQrText(text){
    if (!text) return;
    var payload;
    try{ payload = qrDecode(text); }
    catch(e){ toast('Invalid QR data'); return; }

    if (payload.type === 'offer') acceptQrOffer(text);
    else if (payload.type === 'answer') acceptQrAnswer(text);
    else toast('Unknown attendance QR');
  }

  function connectRoom(){
    deviceId = getDeviceId();
    peerCount = 0;
    updatePeerBadge();
    setQrStatus('client-side QR mode — no server required');

    // No persistent connection is opened here. The teacher explicitly starts
    // a QR handshake, and each student joins by scanning the host QR.
    forceResync = function(){
      Object.keys(qrPeers).forEach(function(id){
        var ch = qrPeers[id] && qrPeers[id].channel;
        if (ch && ch.readyState === 'open'){
          try{
            ch.send(JSON.stringify({
              type:'snapshot',
              room:ROOM_ID,
              dump:bytesToBase64(db.export())
            }));
          }catch(e){}
        }
      });
      toast('Peer snapshot sent');
    };
  }

      var val = document.getElementById('newPin').value.trim();
      if (!val){ toast('Enter a PIN first'); return; }
      doMutation({ type: 'SET_SETTING', key: 'pin', value: val });
      toast('PIN updated');
    });
})
        .catch(function(){ toast('Sync failed — check GitHub settings'); });
    });
  }

  function render(){
    document.getElementById('tabCheckin').classList.toggle('active', state.tab === 'checkin');
    document.getElementById('tabRegister').classList.toggle('active', state.tab === 'register');
    if (state.loading){ viewEl.innerHTML = '<div class="empty">Opening the register…</div>'; return; }
    if (state.tab === 'checkin') renderCheckinTab();
    else renderRegister();
  }

  document.getElementById('tabCheckin').addEventListener('click', function(){ state.tab = 'checkin'; render(); });
  document.getElementById('tabRegister').addEventListener('click', function(){ state.tab = 'register'; render(); });

  (function boot(){
    updatePeerBadge();
    render();
    initSqlJs({ locateFile: function(f){ return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f; } })
      .then(function(SQLModule){
        SQL = SQLModule;
        return idbGet('sqlite');
      })
      .then(function(savedBytes){
        db = savedBytes ? new SQL.Database(new Uint8Array(savedBytes)) : new SQL.Database();
        runSchema();
        state.profile = loadProfile();
        connectRoom();
        state.loading = false;
        render();
      })
      .catch(function(e){
        console.error('startup failed', e);
        viewEl.innerHTML = '<div class="empty">Could not start the local database. Try reloading the page.</div>';
      });
  })();
})();
</script>
