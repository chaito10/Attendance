<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Local IndexedDB + WebRTC QR; no database WASM required -->
<!-- Serverless WebRTC (peer discovery via public torrent trackers, no signaling server) -->
<style>
  :root{
    --cover: #28402f;
    --cover-dark: #1b2c20;
    --brass: #9c7a3c;
    --paper: #f1ead9;
    --paper-2: #e9e0c9;
    --line: #c7bb99;
    --ink: #232a22;
    --ink-soft: #6b6650;
    --stamp: #a3392c;
    --stamp-dark: #7e2a20;
    --good: #3d6b4a;
    --font-display: 'Zilla Slab', Georgia, serif;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: #0f1712;
    background-image: radial-gradient(ellipse at top, #1c2b21 0%, #0f1712 70%);
    font-family: var(--font-body);
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 14px 60px;
  }
  .book{
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.4);
  }
  .spine{
    width: 34px; flex: none;
    background: linear-gradient(180deg, var(--cover), var(--cover-dark));
    display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
    padding: 24px 0;
  }
  .rivet{
    width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c9a75c, var(--brass) 60%, #6e5324 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.5) inset, 0 1px 1px rgba(255,255,255,0.15);
  }
  .pages{
    flex: 1;
    background: repeating-linear-gradient(var(--paper), var(--paper) 34px, var(--line) 35px), linear-gradient(180deg, var(--paper), var(--paper-2));
    padding: 26px 26px 20px;
    min-width: 0;
  }
  header.title{
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 4px; flex-wrap: wrap; gap: 6px;
  }
  header.title h1{
    font-family: var(--font-display); font-weight: 700; font-size: 26px;
    letter-spacing: 0.04em; margin: 0; text-transform: uppercase;
  }
  .head-right{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  header.title .today{ font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); }
  .peer-badge{ font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); display:flex; align-items:center; gap:5px; }
  .peer-dot{ width:7px; height:7px; border-radius:50%; background:#9a9179; }
  .peer-dot.live{ background: var(--good); box-shadow: 0 0 0 2px rgba(61,107,74,0.2); }
  nav.tabs{ display: flex; gap: 6px; margin: 16px 0 18px; }
  nav.tabs button{
    font-family: var(--font-display); font-size: 14.5px; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--paper-2); border: 1px solid var(--line); border-bottom: none; color: var(--ink-soft);
    padding: 8px 16px 7px; border-radius: 6px 6px 0 0; cursor: pointer;
  }
  nav.tabs button.active{
    background: var(--paper); color: var(--ink); font-weight: 700; border-color: var(--ink);
    box-shadow: 0 -2px 0 var(--stamp) inset;
  }
  .card{ background: rgba(255,255,255,0.28); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
  .status-row{ display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .status-dot{ width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .status-dot.open{ background: var(--good); box-shadow: 0 0 0 3px rgba(61,107,74,0.2); }
  .status-dot.closed{ background: var(--stamp); box-shadow: 0 0 0 3px rgba(163,57,44,0.18); }
  .muted{ color: var(--ink-soft); font-size: 12.5px; }
  .count-badge{ font-family: var(--font-mono); font-weight: 600; font-size: 13px; background: var(--ink); color: var(--paper); padding: 4px 10px; border-radius: 20px; }
  input[type=text], input[type=password], input[type=date], input[type=tel], textarea, select{
    font-family: var(--font-mono); background: rgba(255,255,255,0.55); border: 1px solid var(--line);
    border-radius: 5px; padding: 9px 10px; font-size: 14px; color: var(--ink); width: 100%;
  }
  input:focus, textarea:focus, select:focus, button:focus-visible{ outline: 2px solid var(--stamp); outline-offset: 1px; }
  .search{ margin-bottom: 12px; }
  .roster-list{ display: flex; flex-direction: column; }
  .roll-row{ display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px dashed var(--line); }
  .roll-row:last-child{ border-bottom: none; }
  .roll-no{ font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
  .stud-name{ font-family: var(--font-body); font-size: 15px; font-weight: 500; }
  .stud-name .sub{ display:block; font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); font-weight: 400; margin-top:1px; }
  button.mark-btn{
    font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--ink); color: var(--paper); border: none; border-radius: 5px; padding: 9px 14px; cursor: pointer;
    transition: transform 0.08s ease;
  }
  button.mark-btn:disabled{ background: var(--line); color: var(--ink-soft); cursor: default; }
  button.mark-btn:active:not(:disabled){ transform: scale(0.96); }
  .stamp-wrap{ position: relative; display:flex; align-items:center; justify-content:flex-end; }
  .stamp{
    font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; color: var(--stamp);
    border: 2.5px solid var(--stamp); border-radius: 4px; padding: 3px 8px; transform: rotate(-9deg) scale(1);
    display: inline-block; text-transform: uppercase; opacity: 0.92; animation: stampIn 0.28s cubic-bezier(.2,1.4,.4,1);
  }
  .stamp.big{ font-size: 20px; padding: 8px 18px; border-width: 3px; }
  @keyframes stampIn{ 0%{ transform: rotate(-9deg) scale(2.4); opacity: 0; } 60%{ opacity: 1; } 100%{ transform: rotate(-9deg) scale(1); opacity: 0.92; } }
  @media (prefers-reduced-motion: reduce){ .stamp{ animation: none; } button.mark-btn{ transition: none; } }
  .btn{
    font-family: var(--font-display); font-weight: 600; font-size: 13.5px; letter-spacing: 0.03em; text-transform: uppercase;
    background: var(--cover); color: var(--paper); border: none; border-radius: 5px; padding: 9px 16px; cursor: pointer;
  }
  .btn.secondary{ background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.big{ font-size: 16px; padding: 13px 22px; width: 100%; }
  .btn:disabled{ opacity: 0.5; cursor: default; }
  .row{ display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size: 12.5px; color: var(--ink-soft); flex:1; min-width: 140px; }
  h2.section{ font-family: var(--font-display); font-size: 16px; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .pin-gate{ text-align:center; padding: 30px 10px; }
  .pin-gate input{ max-width: 160px; margin: 12px auto; text-align:center; letter-spacing: 0.3em; font-size: 18px; }
  table.report{ width:100%; border-collapse: collapse; font-size: 13.5px; }
  table.report th, table.report td{ text-align:left; padding: 7px 6px; border-bottom: 1px dashed var(--line); }
  table.report th{ font-family: var(--font-mono); font-size: 11.5px; text-transform: uppercase; color: var(--ink-soft); }
  .empty{ text-align:center; padding: 30px 10px; color: var(--ink-soft); font-size: 13.5px; }
  .toast{
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper);
    font-family: var(--font-mono); font-size: 13px; padding: 9px 16px; border-radius: 20px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease; z-index: 50;
  }
  .toast.show{ opacity: 0.96; }
  .rem-btn{ background:none; border:none; color: var(--stamp-dark); cursor:pointer; font-size: 12px; font-family: var(--font-mono); }
  .id-card{ text-align:center; padding: 8px 10px 18px; }
  .id-card .name{ font-family: var(--font-display); font-weight: 700; font-size: 22px; margin: 6px 0 2px; }
  .id-card .roll{ font-family: var(--font-mono); color: var(--ink-soft); font-size: 13px; }
  .qr-box{ text-align:center; }
  .qr-box img{ border: 6px solid #fff; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); margin: 10px 0; }
  .link-copy{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .link-copy code{ font-family: var(--font-mono); font-size: 12px; background: rgba(0,0,0,0.06); padding: 5px 8px; border-radius: 4px; word-break: break-all; }
  .percent-badge{ font-family: var(--font-mono); font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 20px; }
  .percent-badge.ok{ background: rgba(61,107,74,0.15); color: var(--good); }
  .percent-badge.low{ background: rgba(163,57,44,0.14); color: var(--stamp-dark); }
</style>

<script>
(function(){
  function add(src){var s=document.createElement('script');s.src=src;s.async=true;document.head.appendChild(s);}
  add('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');
})();
</script>
</head>
<body>
<div id="qrModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:16px;">
  <div style="background:var(--paper);border-radius:10px;padding:18px;max-width:420px;width:100%;text-align:center;color:var(--ink);">
    <h2 id="qrTitle" class="section">QR</h2><p id="qrHelp" class="muted"></p>
    <div id="qrCode" style="display:flex;justify-content:center;margin:12px 0;min-height:40px;"></div><textarea id="qrSignalText" readonly style="width:100%;height:100px;font-family:var(--font-mono);font-size:10px;margin:8px 0;"></textarea><div class="row" style="justify-content:center;"><button class="btn secondary" id="copySignalBtn">Copy signal</button><button class="btn secondary" id="pasteSignalBtn">Paste signal</button></div>
    <button class="btn secondary" onclick="document.getElementById('qrModal').style.display='none'">Close</button>
  </div>
</div>
<input id="qrFile" type="file" accept="image/*" capture="environment" style="display:none">

  <div class="book">
    <div class="spine">
      <div class="rivet"></div><div class="rivet"></div><div class="rivet"></div><div class="rivet"></div>
    </div>
    <div class="pages">
      <header class="title">
        <h1>Attendance Register</h1>
        <div class="head-right">
          <div class="today" id="todayLabel">—</div>
          <div class="peer-badge"><span class="peer-dot" id="peerDot"></span><span id="peerText">QR peer mode — no server</span></div>
        </div>
      </header>
      <nav class="tabs">
        <button id="tabCheckin" class="active">Check In</button>
        <button id="tabRegister">Register</button>
      </nav>
      <div id="view"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // Change this once per class/semester before you deploy — it's the WebRTC room
  // every device syncs through. Different code = different, unconnected roster.
  var ROOM_ID = "nfsu-cyber-attendance-2026";

  var todayStr = new Date().toISOString().slice(0,10);
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined,{ weekday:'short', year:'numeric', month:'short', day:'numeric' });

    var db = null;        // local JSON store
  var peerCount = 0;
  
  var forceResync = null;

  var state = {
    tab: 'checkin',
    profile: null,
    reportDate: todayStr,
    loading: true
  };

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function updatePeerBadge(){
    document.getElementById('peerDot').classList.toggle('live', peerCount > 0);
    document.getElementById('peerText').textContent = peerCount > 0
      ? (peerCount + ' device' + (peerCount === 1 ? '' : 's') + ' synced')
      : 'no devices linked yet';
  }

  // ---------- device-local identity (per-phone, plain browser storage — fine now this isn't a Claude artifact) ----------
  function loadProfile(){ try{ var v = localStorage.getItem('attendance_profile_v1'); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function saveProfile(p){ try{ localStorage.setItem('attendance_profile_v1', JSON.stringify(p)); }catch(e){} }
  function clearProfile(){ try{ localStorage.removeItem('attendance_profile_v1'); }catch(e){} }

  // ---------- local IndexedDB JSON persistence ----------
  var IDB_NAME = 'attendance-register', IDB_STORE = 'kv';
  var db = null;

  function emptyDb(){ return {students:[], sessions:[], attendance:[], settings:[]}; }
  function idbOpen(){
    return new Promise(function(resolve,reject){
      var req=indexedDB.open(IDB_NAME,1);
      req.onupgradeneeded=function(){ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
      req.onsuccess=function(){resolve(req.result);}; req.onerror=function(){reject(req.error);};
    });
  }
  function idbGet(key){ return idbOpen().then(function(idb){ return new Promise(function(resolve,reject){
    var tx=idb.transaction(IDB_STORE,'readonly'), r=tx.objectStore(IDB_STORE).get(key);
    r.onsuccess=function(){resolve(r.result || null);}; r.onerror=function(){reject(r.error);};
  });}).catch(function(){return null;}); }
  function idbSet(key,val){ return idbOpen().then(function(idb){ return new Promise(function(resolve,reject){
    var tx=idb.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=function(){resolve(true);}; tx.onerror=function(){reject(tx.error);};
  });}).catch(function(){return false;}); }
  var persistTimer=null;
  function persistLocal(){ clearTimeout(persistTimer); persistTimer=setTimeout(function(){ if(db) idbSet('state',JSON.stringify(db)); },120); }
  function loadDb(){ return idbGet('state').then(function(v){ try{ return v ? Object.assign(emptyDb(),JSON.parse(v)) : emptyDb(); }catch(e){ return emptyDb(); } }); }
  function exportDb(){ return new TextEncoder().encode(JSON.stringify(db || emptyDb())); }
  function importDb(bytes){ var t=new TextDecoder().decode(bytes instanceof Uint8Array?bytes:new Uint8Array(bytes)); return Object.assign(emptyDb(),JSON.parse(t)); }
  function runSchema(){ }

  // ---------- reads ----------
  function getRoster(){ return (db.students||[]).slice().sort(function(a,b){return String(a.roll).localeCompare(String(b.roll));}); }
  function getSessionOpen(date){ var r=db.sessions.find(function(x){return x.date===date;}); return !!(r&&r.open); }
  function getAttendanceMap(date){ var m={}; db.attendance.filter(function(x){return x.date===date;}).forEach(function(x){m[x.student_id]={time:x.time};}); return m; }
  function getSessionDates(){ return db.sessions.map(function(x){return x.date;}).sort(); }
  function getHistoryDates(id){ return db.attendance.filter(function(x){return x.student_id===id;}).map(function(x){return x.date;}).sort(); }
  function getSetting(key,def){ var r=db.settings.find(function(x){return x.key===key;}); return r ? r.value : def; }

  // ---------- mutations ----------
  function applyMutationLocally(m){
    if(m.type==='ADD_STUDENT' && !db.students.some(function(x){return x.id===m.id})) db.students.push({id:m.id,roll:m.roll,name:m.name,phone:m.phone||''});
    else if(m.type==='REMOVE_STUDENT') db.students=db.students.filter(function(x){return x.id!==m.id;});
    else if(m.type==='SET_SESSION'){ var ss=db.sessions.find(function(x){return x.date===m.date;}); if(ss) ss.open=!!m.open; else db.sessions.push({date:m.date,open:!!m.open}); }
    else if(m.type==='MARK_ATTENDANCE' && !db.attendance.some(function(x){return x.date===m.date&&x.student_id===m.student_id})) db.attendance.push({date:m.date,student_id:m.student_id,time:m.time});
    else if(m.type==='SET_SETTING'){ var st=db.settings.find(function(x){return x.key===m.key;}); if(st) st.value=m.value; else db.settings.push({key:m.key,value:m.value}); }
    persistLocal();
  }
  function doMutation(m){ applyMutationLocally(m); if(sendMutationToPeers) try{sendMutationToPeers(m);}catch(e){console.warn(e);} render(); }
  function mergeExternalDump(bytes){ try{
    var incoming=importDb(bytes);
    (incoming.students||[]).forEach(function(x){if(!db.students.some(function(y){return y.id===x.id}))db.students.push(x);});
    (incoming.sessions||[]).forEach(function(x){var y=db.sessions.find(function(z){return z.date===x.date;});if(y)y.open=!!x.open;else db.sessions.push(x);});
    (incoming.attendance||[]).forEach(function(x){if(!db.attendance.some(function(y){return y.date===x.date&&y.student_id===x.student_id}))db.attendance.push(x);});
    (incoming.settings||[]).forEach(function(x){var y=db.settings.find(function(z){return z.key===x.key;});if(y)y.value=x.value;else db.settings.push(x);});
    persistLocal();
  }catch(e){console.error('merge failed',e);} }

  // ---------- 100% client-side QR/WebRTC signaling ----------
  var qrPeers={}, qrConnection=null, qrRole=null;
  function deviceId(){ try{var k='attendance_device_id';var v=localStorage.getItem(k);if(!v){v='peer_'+crypto.randomUUID();localStorage.setItem(k,v);}return v;}catch(e){return 'peer_'+Math.random().toString(36).slice(2);} }
  function b64u(bytes){var bin='';for(var i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));return btoa(bin);}
  function u8(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
  function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
  function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))));}
  function qrStatus(t){var e=document.getElementById('qrSyncStatus');if(e)e.textContent=t;document.getElementById('peerText').textContent=t;}
  function rtc(){return new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});}
  function iceDone(pc){return new Promise(function(resolve){if(pc.iceGatheringState==='complete')return resolve();var done=false;function f(){if(done)return;done=true;pc.removeEventListener('icegatheringstatechange',f);resolve();}pc.addEventListener('icegatheringstatechange',function(){if(pc.iceGatheringState==='complete')f();});setTimeout(f,8000);});}
  function sendSnapshot(ch){try{ch.send(JSON.stringify({type:'snapshot',room:ROOM_ID,dump:b64u(exportDb())}));}catch(e){}}
  function wireChannel(ch,id){
    id = id || ('peer_'+Math.random().toString(36).slice(2));
    qrPeers[id]={channel:ch};
    ch.onopen=function(){
      try{ch.send(JSON.stringify({type:'hello',room:ROOM_ID,peerId:deviceId()}));}catch(e){}
      peerCount=Object.keys(qrPeers).length;updatePeerBadge();qrStatus(peerCount+' peer'+(peerCount===1?'':'s')+' connected');sendSnapshot(ch);
    };
    ch.onclose=function(){delete qrPeers[id];peerCount=Object.keys(qrPeers).length;updatePeerBadge();};
    ch.onmessage=function(ev){try{var m=JSON.parse(ev.data);if(m.room!==ROOM_ID)return;if(m.type==='hello'){ qrPeers[id].peerId=m.peerId; return; } if(m.type==='snapshot')mergeExternalDump(u8(m.dump));else if(m.type==='mutation')applyMutationLocally(m.mutation);render();}catch(e){console.warn(e);}};
  }
  function payload(type,pc){return {app:'attendance-qr-p2p',v:1,type:type,room:ROOM_ID,from:deviceId(),description:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}};}
  function openQrModal(title,text,data){
    document.getElementById('qrTitle').textContent=title;document.getElementById('qrHelp').textContent=text;document.getElementById('qrSignalText').value=data;
    var box=document.getElementById('qrCode');box.innerHTML='';
    if(window.QRCode){new QRCode(box,{text:data,width:280,height:280,correctLevel:QRCode.CorrectLevel.L});}
    else {var ta=document.createElement('textarea');ta.readOnly=true;ta.value=data;ta.style.width='100%';ta.style.height='170px';box.appendChild(ta);}
    document.getElementById('qrModal').style.display='flex';
    var cb=document.getElementById('copySignalBtn'); if(cb) cb.onclick=function(){navigator.clipboard.writeText(data).then(function(){toast('Signal copied');}).catch(function(){toast('Select and copy the signal');});};
    var pb=document.getElementById('pasteSignalBtn'); if(pb) pb.onclick=async function(){var x=prompt('Paste the QR signal text');if(x){var o;try{o=dec(x);}catch(e){toast('Invalid signal');return;}if(o.type==='offer')await acceptOffer(x);else if(o.type==='answer')await acceptAnswer(x);}};
  }
  function closeQrModal(){document.getElementById('qrModal').style.display='none';}
  async function createHostQr(){
    qrRole='host';var pc=rtc();qrConnection=pc;var ch=pc.createDataChannel('attendance');wireChannel(ch,'pending');
    await pc.setLocalDescription(await pc.createOffer());await iceDone(pc);
    openQrModal('Host QR','Student scans this QR, then shows the answer QR back to you.',enc(payload('offer',pc)));qrStatus('Host QR ready — waiting for student');
  }
  async function acceptOffer(raw){
    var o;try{o=dec(raw);}catch(e){toast('Invalid QR');return;}if(!o||o.app!=='attendance-qr-p2p'||o.type!=='offer'||o.room!==ROOM_ID){toast('Wrong attendance session');return;}
    qrRole='student';var pc=rtc();qrConnection=pc;pc.ondatachannel=function(e){wireChannel(e.channel,o.from||'host');};
    await pc.setRemoteDescription(o.description);await pc.setLocalDescription(await pc.createAnswer());await iceDone(pc);
    openQrModal('Answer QR','Show this QR to the teacher to finish the connection.',enc(payload('answer',pc)));qrStatus('Answer ready — show it to teacher');
  }
  async function acceptAnswer(raw){
    var a;try{a=dec(raw);}catch(e){toast('Invalid answer QR');return;}if(!qrConnection||a.type!=='answer'||a.room!==ROOM_ID){toast('Answer does not match this session');return;}
    await qrConnection.setRemoteDescription(a.description);closeQrModal();qrStatus('Connecting…');
  }
  function scanQr(){
    var input=document.getElementById('qrFile');input.click();
  }
  function sendMutationToPeers(m){Object.keys(qrPeers).forEach(function(id){var c=qrPeers[id].channel;if(c&&c.readyState==='open')try{c.send(JSON.stringify({type:'mutation',room:ROOM_ID,mutation:m}));}catch(e){}});}
  function connectRoom(){deviceId();forceResync=function(){Object.keys(qrPeers).forEach(function(id){var c=qrPeers[id].channel;if(c&&c.readyState==='open')sendSnapshot(c);});toast('Snapshot sent to connected peers');};updatePeerBadge();}

  // ---------- shared render helpers ----------
  var viewEl = document.getElementById('view');
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString(undefined,{hour:'2-digit', minute:'2-digit'}); }catch(e){ return ''; } }
  function fmtDate(d){ try{ return new Date(d + 'T00:00:00').toLocaleDateString(undefined,{ month:'short', day:'numeric' }); }catch(e){ return d; } }

  // ---------- Check In tab ----------
  function renderRegistrationForm(){
    var html = '<div class="card">';
    html += '<h2 class="section">Sign the register</h2>';
    html += '<div class="muted" style="margin-bottom:10px;">First time here — this device will remember you next time you scan.</div>';
    html += '<div class="row"><label class="field">Full name<input type="text" id="regName" placeholder="e.g. Aditi Rao"></label></div>';
    html += '<div class="row"><label class="field">Roll number<input type="text" id="regRoll" placeholder="e.g. 21CY014"></label>';
    html += '<label class="field">Phone number<input type="tel" id="regPhone" placeholder="10-digit mobile"></label></div>';
    html += '<div class="row" style="margin-top:6px;"><button class="btn big" id="regSubmit">Register &amp; continue</button></div>';
    html += '</div>';
    viewEl.innerHTML = html;

    document.getElementById('regSubmit').addEventListener('click', function(){
      var name = document.getElementById('regName').value.trim();
      var roll = document.getElementById('regRoll').value.trim();
      var phone = document.getElementById('regPhone').value.trim();
      if (!name || !roll){ toast('Name and roll number are required'); return; }

      var dup = getRoster().find(function(s){ return s.roll.toLowerCase() === roll.toLowerCase(); });
      var btn = document.getElementById('regSubmit');
      if (dup && !btn.dataset.confirmed){
        toast('That roll no. is already registered — tap again to continue anyway');
        btn.dataset.confirmed = '1';
        btn.textContent = 'Yes, continue anyway';
        return;
      }

      var id = 's_' + roll.replace(/\s+/g,'_').toLowerCase() + '_' + Date.now().toString(36);
      var entry = { id: id, roll: roll, name: name, phone: phone };
      doMutation({ type: 'ADD_STUDENT', id: id, roll: roll, name: name, phone: phone });
      state.profile = entry;
      saveProfile(entry);
      toast('Welcome, ' + name + '!');
      render();
    });
  }

  function renderCheckin(){
    var p = state.profile;
    var attendanceToday = getAttendanceMap(todayStr);
    var alreadyMarked = !!attendanceToday[p.id];
    var sessionOpen = getSessionOpen(todayStr);
    var sessionDates = getSessionDates();
    var history = getHistoryDates(p.id);
    var pct = sessionDates.length ? Math.round((history.length / sessionDates.length) * 100) : null;

    var html = '';
    html += '<div class="card id-card">';
    html += '<div class="muted">Registered as</div>';
    html += '<div class="name">' + escapeHtml(p.name) + '</div>';
    html += '<div class="roll">Roll ' + escapeHtml(p.roll) + (p.phone ? ' &middot; ' + escapeHtml(p.phone) : '') + '</div>';
    html += '</div>';

    html += '<div class="card status-row">';
    html += '<div><span class="status-dot ' + (sessionOpen ? 'open' : 'closed') + '"></span>' +
      '<strong>' + (sessionOpen ? 'Session open' : 'Session closed') + '</strong>' +
      '<div class="muted">' + escapeHtml(todayStr) + '</div></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<h2 class="section">Connect to teacher</h2>';
    html += '<div class="muted" style="margin-bottom:8px;">Scan the teacher host QR once. Your phone will create an answer QR for the teacher.</div>';
    html += '<button class="btn" id="joinHostBtn">Join teacher with QR</button>';
    html += '</div>';

    html += '<div class="card" style="text-align:center;">';
    if (alreadyMarked){
      html += '<div class="stamp big">Present</div>';
      html += '<div class="muted" style="margin-top:8px;">Marked at ' + fmtTime(attendanceToday[p.id].time) + '</div>';
    } else if (sessionOpen){
      html += '<button class="btn big" id="markBtn">Mark my attendance</button>';
    } else {
      html += '<div class="muted">Attendance isn\'t open right now. Check back when your teacher starts roll call.</div>';
    }
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="row" style="justify-content:space-between;">';
    html += '<h2 class="section" style="border:none;margin:0;">My attendance</h2>';
    if (pct !== null){ html += '<span class="percent-badge ' + (pct >= 75 ? 'ok' : 'low') + '">' + history.length + ' / ' + sessionDates.length + ' &middot; ' + pct + '%</span>'; }
    html += '</div>';
    if (sessionDates.length === 0){
      html += '<div class="empty">No sessions recorded yet.</div>';
    } else {
      var dates = sessionDates.slice().sort().reverse();
      html += '<table class="report"><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody>';
      html += dates.map(function(d){
        var present = history.indexOf(d) > -1;
        return '<tr><td>' + fmtDate(d) + '</td><td>' + (present ? '<span style="color:var(--good);font-weight:600;">Present</span>' : '<span class="muted">Absent</span>') + '</td></tr>';
      }).join('');
      html += '</tbody></table>';
    }
    html += '</div>';

    html += '<div class="row"><button class="rem-btn" id="notMe">Not you? Reset registration on this device</button></div>';

    viewEl.innerHTML = html;

    if (!alreadyMarked && sessionOpen){
      document.getElementById('markBtn').addEventListener('click', function(){
        var btn = document.getElementById('markBtn');
        btn.disabled = true;
        doMutation({ type: 'MARK_ATTENDANCE', date: todayStr, student_id: p.id, time: new Date().toISOString() });
        toast('You\'re marked present');
      });
    }
    var joinBtn=document.getElementById('joinHostBtn'); if(joinBtn) joinBtn.addEventListener('click',scanQr);
    document.getElementById('notMe').addEventListener('click', function(){
      if (!confirm('Clear this device\'s registration? You\'ll need to sign the register again.')) return;
      clearProfile();
      state.profile = null;
      render();
    });
  }

  function renderCheckinTab(){
    if (!state.profile) renderRegistrationForm();
    else renderCheckin();
  }

  // ---------- Register (teacher) tab ----------
  var teacherAuthed = false;
  function renderPinGate(){
    viewEl.innerHTML =
      '<div class="card pin-gate">' +
      '<h2 class="section" style="border:none;">Class in charge</h2>' +
      '<div class="muted">Enter the register PIN to manage the roster and session.</div>' +
      '<input type="password" id="pinInput" inputmode="numeric" placeholder="••••" maxlength="8">' +
      '<div><button class="btn" id="pinSubmit">Unlock</button></div>' +
      '</div>';
    var input = document.getElementById('pinInput');
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
    document.getElementById('pinSubmit').addEventListener('click', submit);
    function submit(){
      if (input.value === getSetting('pin', '0000')){ teacherAuthed = true; render(); }
      else toast('Incorrect PIN');
    }
  }

  function renderRegister(){
    if (!teacherAuthed){ renderPinGate(); return; }
    var roster = getRoster();
    var attendance = getAttendanceMap(state.reportDate);
    var sessionOpen = getSessionOpen(state.reportDate);
    var presentCount = Object.keys(attendance).length;

    var html = '';
    html += '<div class="card">';
    html += '<h2 class="section">Session control</h2>';
    html += '<div class="row" style="margin-bottom:10px;">';
    html += '<label class="field">Date<input type="date" id="reportDate" value="' + state.reportDate + '"></label>';
    html += '<label class="field">Status<div class="row"><span class="status-dot ' + (sessionOpen ? 'open' : 'closed') + '"></span>' + (sessionOpen ? 'Open' : 'Closed') + '</div></label>';
    html += '</div>';
    html += '<div class="row"><button class="btn" id="toggleSession">' + (sessionOpen ? 'Close session' : 'Open session') + '</button>';
    html += '<span class="count-badge">' + presentCount + ' / ' + roster.length + ' present</span>';
    html += '<button class="btn secondary" id="resyncBtn">Force resync</button></div>';
    html += '</div>';

    html += '<div class="card qr-box">';
    html += '<h2 class="section" style="text-align:left;">Connect student devices</h2>';
    html += '<div class="muted" style="margin-bottom:10px;">100% client-side signaling. Create one host QR per student connection.</div>';
    html += '<div class="row"><button class="btn" id="hostQrBtn">Create host QR</button><button class="btn secondary" id="scanAnswerBtn">Scan student answer</button></div>';
    html += '<div class="muted" id="qrSyncStatus" style="margin-top:8px;">No peer connected</div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<h2 class="section">Attendance — ' + escapeHtml(state.reportDate) + '</h2>';
    if (roster.length === 0){
      html += '<div class="empty">No one has registered yet. Share the QR code, or add students manually below.</div>';
    } else {
      html += '<table class="report"><thead><tr><th>Roll</th><th>Name</th><th>Status</th><th>Time</th><th></th></tr></thead><tbody>';
      html += roster.map(function(s){
        var m = attendance[s.id];
        var action = m ? '' : '<button class="rem-btn" data-mark="' + escapeHtml(s.id) + '">mark present</button>';
        return '<tr><td>' + escapeHtml(s.roll) + '</td><td>' + escapeHtml(s.name) + '</td>' +
          '<td>' + (m ? '<span style="color:var(--good);font-weight:600;">Present</span>' : '<span class="muted">Absent</span>') + '</td>' +
          '<td class="muted">' + (m ? fmtTime(m.time) : '—') + '</td><td>' + action + '</td></tr>';
      }).join('');
      html += '</tbody></table>';
    }
    html += '<div class="row" style="margin-top:12px;"><button class="btn secondary" id="exportCsv">Export CSV</button></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<h2 class="section">Add students manually</h2>';
    html += '<div class="muted" style="margin-bottom:8px;">One per line: <code>roll, name, phone</code> — phone is optional</div>';
    html += '<textarea id="bulkAdd" rows="3" placeholder="21CY001, Aditi Rao, 9876543210\n21CY002, Basavaraj Patil"></textarea>';
    html += '<div class="row" style="margin-top:8px;"><button class="btn" id="bulkAddBtn">Add to roll</button></div>';
    html += '<div class="roster-list" style="margin-top:12px;">';
    html += roster.map(function(s){
      return '<div class="roll-row"><div class="roll-no">' + escapeHtml(s.roll) + '</div><div class="stud-name">' + escapeHtml(s.name) + (s.phone ? '<span class="sub">' + escapeHtml(s.phone) + '</span>' : '') + '</div>' +
        '<button class="rem-btn" data-id="' + escapeHtml(s.id) + '">remove</button></div>';
    }).join('') || '<div class="empty">No students yet.</div>';
    html += '</div></div>';

    html += '<div class="card">';
    html += '<h2 class="section">Register PIN</h2>';
    html += '<div class="row"><label class="field">New PIN<input type="text" id="newPin" placeholder="' + escapeHtml(getSetting('pin','0000')) + '"></label>';
    html += '<button class="btn secondary" id="savePin" style="align-self:flex-end;">Save PIN</button></div>';
    html += '</div>';

    html += '<div class="card"><h2 class="section">Client-side peer connection</h2><div class="muted">Room code baked into this file: <code>' + escapeHtml(ROOM_ID) + '</code> — every device running this exact file syncs together. Change it in the source before a new semester to start a fresh roster.</div></div>';

    viewEl.innerHTML = html;

    document.getElementById('reportDate').addEventListener('change', function(e){
      state.reportDate = e.target.value;
      render();
    });

    document.getElementById('toggleSession').addEventListener('click', function(){
      doMutation({ type: 'SET_SESSION', date: state.reportDate, open: !sessionOpen });
    });

    document.getElementById('hostQrBtn').addEventListener('click', function(){ createHostQr().catch(function(e){console.error(e);toast('Could not create host QR');}); });
    document.getElementById('scanAnswerBtn').addEventListener('click', scanQr);

    document.getElementById('resyncBtn').addEventListener('click', function(){
      if (forceResync) forceResync(); else toast('Not connected to any peers');
    });

    document.getElementById('exportCsv').addEventListener('click', function(){
      var rows = [['Roll','Name','Phone','Status','Time']];
      roster.forEach(function(s){
        var m = attendance[s.id];
        rows.push([s.roll, s.name, s.phone || '', m ? 'Present' : 'Absent', m ? fmtTime(m.time) : '']);
      });
      var csv = rows.map(function(r){ return r.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
      var blob = new Blob([csv], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'attendance-' + state.reportDate + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    document.getElementById('bulkAddBtn').addEventListener('click', function(){
      var lines = document.getElementById('bulkAdd').value.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      var added = 0;
      var existing = getRoster();
      lines.forEach(function(line){
        var parts = line.split(',');
        if (parts.length < 2) return;
        var roll = parts[0].trim();
        var name = parts[1].trim();
        var phone = (parts[2] || '').trim();
        if (!roll || !name) return;
        if (existing.some(function(s){ return s.roll === roll; })) return;
        var id = 's_' + roll.replace(/\s+/g,'_').toLowerCase() + '_' + Date.now().toString(36) + added;
        doMutation({ type: 'ADD_STUDENT', id: id, roll: roll, name: name, phone: phone });
        added++;
      });
      toast(added > 0 ? (added + ' student(s) added') : 'Nothing to add — check the format');
      render();
    });

    viewEl.querySelectorAll('[data-id]').forEach(function(btn){
      btn.addEventListener('click', function(){
        doMutation({ type: 'REMOVE_STUDENT', id: btn.getAttribute('data-id') });
      });
    });
    viewEl.querySelectorAll('[data-mark]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-mark');
        var stud = roster.find(function(s){ return s.id === id; });
        if (!stud) return;
        doMutation({ type: 'MARK_ATTENDANCE', date: state.reportDate, student_id: id, time: new Date().toISOString() });
      });
    });

    document.getElementById('savePin').addEventListener('click', function(){
      var val = document.getElementById('newPin').value.trim();
      if (!val){ toast('Enter a PIN first'); return; }
      doMutation({ type: 'SET_SETTING', key: 'pin', value: val });
      toast('PIN updated');
    });
  }

  function render(){
    document.getElementById('tabCheckin').classList.toggle('active', state.tab === 'checkin');
    document.getElementById('tabRegister').classList.toggle('active', state.tab === 'register');
    if (state.loading){ viewEl.innerHTML = '<div class="empty">Opening the register…</div>'; return; }
    if (state.tab === 'checkin') renderCheckinTab();
    else renderRegister();
  }

  document.getElementById('tabCheckin').addEventListener('click', function(){ state.tab = 'checkin'; render(); });
  document.getElementById('tabRegister').addEventListener('click', function(){ state.tab = 'register'; render(); });

  (async function boot(){
    updatePeerBadge();
    render();
    try{
      db=await loadDb();
      state.profile=loadProfile();
      connectRoom();
      state.loading=false;
      render();
    }catch(e){
      console.error(e);state.loading=false;
      viewEl.innerHTML='<div class="empty">Could not open local storage. <button class="btn" onclick="location.reload()">Retry</button></div>';
    }
  })();

  window.addEventListener('DOMContentLoaded', function(){
    var qrf=document.getElementById('qrFile');
    if(!qrf)return;
    qrf.addEventListener('change', async function(){
      var file=this.files&&this.files[0];this.value='';if(!file)return;
      if('BarcodeDetector' in window){
        try{var d=new BarcodeDetector({formats:['qr_code']});var b=await createImageBitmap(file);var codes=await d.detect(b);if(codes.length){var raw=codes[0].rawValue;var o=dec(raw);if(o.type==='offer')await acceptOffer(raw);else if(o.type==='answer')await acceptAnswer(raw);return;}}catch(e){console.warn(e);}
      }
      toast('QR image decoding is unavailable in this browser. Use Chrome/Edge on Android, or use the signal text fallback.');
    });
  });
})();
</script>

</body>
</html>
