[project]
name = "attendance"
version = "0.1.1"
description = "Single-file QR Attendance System"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "charudatta10", email = "100494c@gmail.com" }
]
requires-python = ">=3.10.6"
dependencies = [
    "flask>=3.1.3",
    "qrcode[pil]>=8.2",
    "waitress>=3.0.2",
]

[project.scripts]
attendance = "attendance:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
